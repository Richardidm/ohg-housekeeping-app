<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="moxyGlow" x1="170" y1="70" x2="1030" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF75E6"/>
      <stop offset="0.5" stop-color="#FF46D7"/>
      <stop offset="1" stop-color="#D926B4"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#FF46D7" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="34" flood-color="#FF46D7" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <text
      x="110"
      y="240"
      fill="url(#moxyGlow)"
      font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive"
      font-size="220"
      font-style="italic"
      font-weight="700"
      letter-spacing="-16"
      transform="skewX(-8)"
    >moxy</text>
  </g>

  <text
    x="120"
    y="330"
    fill="#FFFFFF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="52"
    font-weight="300"
    letter-spacing="-1.5"
    opacity="0.96"
  >Small choice. Big impact.</text>
</svg>
